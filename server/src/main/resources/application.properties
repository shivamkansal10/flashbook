# Server
server.port=8080

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flashbook}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Shivi@123}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=604800000

# Razorpay
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:placeholder_webhook_secret}

# Seat hold
booking.hold-ttl-seconds=300

# Resilience4j - payment circuit breaker & thread-pool bulkhead
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=15s
resilience4j.retry.instances.paymentService.max-attempts=3
resilience4j.retry.instances.paymentService.wait-duration=500ms
resilience4j.ratelimiter.instances.bookingEndpoint.limit-for-period=20
resilience4j.ratelimiter.instances.bookingEndpoint.limit-refresh-period=1s
resilience4j.ratelimiter.instances.bookingEndpoint.timeout-duration=500ms
resilience4j.thread-pool-bulkhead.instances.bookingService.max-thread-pool-size=20
resilience4j.thread-pool-bulkhead.instances.bookingService.core-thread-pool-size=10
resilience4j.thread-pool-bulkhead.instances.bookingService.queue-capacity=20
resilience4j.bulkhead.instances.bookingService.max-concurrent-calls=50
resilience4j.bulkhead.instances.bookingService.max-wait-duration=2s

# CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002,http://127.0.0.1:3003,http://127.0.0.1:3004,http://127.0.0.1:3005,http://127.0.0.1:5173

