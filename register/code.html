<body class="bg-background min-h-screen flex items-center justify-center relative overflow-hidden font-body-md text-body-md text-on-surface h-screen">
<!-- Background Pattern -->
<div class="absolute inset-0 z-0 pointer-events-none opacity-20" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDrIThRuKL-jRgBVWSY4FhpmzJkRVRzQ4g1IxtXJ32ScN6uGhzhB4VFe5OAkBWDUaVTNlqH8f-dqoSSoWNayQ7X1u5FDZJrssM_4MKJQeCcYNFem3cMucKgdjnpcgFww-tYt4Xz8iMAT2JFhvcR7ncsN_KYxmnz9tol_xOMM9ESyAfojYVNoZB15DLq7XE_LbxhkY2M6x5NmiG9Rn-rq2tp1PRtJjvgd2XvrZpIKKu5pZ2S31q1fKvm8g'); background-size: cover; background-position: center;"></div>
<div class="relative z-10 w-full max-w-[420px] px-margin-mobile flex flex-col gap-unit-lg">
<!-- Header -->
<div class="text-center">
<div class="flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-primary text-[32px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="text-headline-md font-headline-md font-black text-primary tracking-tight">FlashBook</span>
</div>
</div>
<!-- Card -->
<div class="bg-surface-container-lowest rounded-2xl shadow-soft p-unit-xl">
<h1 class="text-headline-md font-headline-md font-bold text-on-surface text-center mb-unit-xl max-w-[200px] mx-auto leading-tight">Create your account</h1>
<form class="space-y-unit-md">
<div>
<label class="block text-label-bold font-label-bold text-on-surface mb-unit-sm" for="fullName">Full Name</label>
<input class="w-full rounded-xl border border-outline-variant bg-surface-container-lowest px-4 py-3 text-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:ring-offset-0 focus:outline-none transition-shadow" id="fullName" placeholder="John Doe" required="" type="text">
</div>
<div>
<label class="block text-label-bold font-label-bold text-on-surface mb-unit-sm" for="email">Email Address</label>
<input class="w-full rounded-xl border border-outline-variant bg-surface-container-lowest px-4 py-3 text-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:ring-offset-0 focus:outline-none transition-shadow" id="email" placeholder="you@example.com" required="" type="email">
</div>
<div>
<label class="block text-label-bold font-label-bold text-on-surface mb-unit-sm" for="password">Password</label>
<input class="w-full rounded-xl border border-outline-variant bg-surface-container-lowest px-4 py-3 text-body-md focus:border-primary focus:ring-1 focus:ring-primary focus:ring-offset-0 focus:outline-none transition-shadow" id="password" placeholder="••••••••" required="" type="password">
<p class="mt-2 text-[13px] text-on-surface-variant font-medium">At least 8 characters with a number</p>
<p class="mt-2 text-[13px] text-error font-medium hidden">Password must contain a number</p>
</div>
<button class="w-full bg-primary text-on-primary rounded-full py-3.5 px-6 text-label-bold font-label-bold hover:opacity-90 transition-opacity mt-unit-lg" type="submit">
                    Create Account
                </button>
</form>
<div class="mt-unit-lg text-center">
<p class="text-body-md font-body-md text-on-surface-variant">
                    Already have an account? <a class="text-[#F97316] hover:opacity-80 font-bold transition-opacity" href="#">Log in</a>
</p>
</div>
</div>
</div>


</body></html>
