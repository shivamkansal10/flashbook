<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FlashBook - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "brand-orange": "#F97316",
                        "surface-container": "#f1edec",
                        "surface-variant": "#e5e2e1",
                        "on-secondary-container": "#5c2400",
                        "on-primary-fixed-variant": "#474646",
                        "primary-container": "#1c1b1b",
                        "on-tertiary-fixed": "#1d1b1a",
                        "tertiary": "#000000",
                        "primary-fixed-dim": "#c8c6c5",
                        "on-background": "#1c1b1b",
                        "tertiary-container": "#1d1b1a",
                        "outline-variant": "#c4c7c7",
                        "inverse-primary": "#c8c6c5",
                        "on-tertiary-fixed-variant": "#484645",
                        "surface-container-high": "#ebe7e6",
                        "secondary-fixed": "#ffdbca",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#313030",
                        "on-surface-variant": "#444748",
                        "on-primary-fixed": "#1c1b1b",
                        "surface": "#fdf8f8",
                        "background": "#fdf8f8",
                        "surface-container-low": "#f7f3f2",
                        "inverse-on-surface": "#f4f0ef",
                        "on-secondary-fixed-variant": "#783200",
                        "on-error-container": "#93000a",
                        "on-surface": "#1c1b1b",
                        "surface-container-lowest": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-dim": "#ddd9d8",
                        "on-tertiary-container": "#868381",
                        "on-primary-container": "#858383",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e5e2e1",
                        "secondary": "#9d4300",
                        "surface-bright": "#fdf8f8",
                        "on-tertiary": "#ffffff",
                        "secondary-container": "#fd761a",
                        "on-secondary-fixed": "#341100",
                        "tertiary-fixed": "#e6e1df",
                        "error-container": "#ffdad6",
                        "primary": "#000000",
                        "surface-tint": "#5f5e5e",
                        "primary-fixed": "#e5e2e1",
                        "tertiary-fixed-dim": "#cac6c3",
                        "outline": "#747878",
                        "secondary-fixed-dim": "#ffb690"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit-lg": "24px",
                        "container-max": "1280px",
                        "gutter": "24px",
                        "unit-xs": "4px",
                        "unit-xl": "48px",
                        "margin-desktop": "64px",
                        "unit-sm": "8px",
                        "unit-md": "16px",
                        "margin-mobile": "20px"
                    },
                    "fontFamily": {
                        "sans": ["Plus Jakarta Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        .pattern-bg {
            background-image: 
                radial-gradient(ellipse at center, transparent 0%, transparent 40%, rgba(229, 226, 225, 0.2) 41%, transparent 42%),
                radial-gradient(ellipse at center, transparent 0%, transparent 60%, rgba(229, 226, 225, 0.3) 61%, transparent 62%);
            background-size: 800px 800px;
            background-position: center -200px;
            background-repeat: no-repeat;
        }
        .soft-shadow {
            box-shadow: 0px 10px 25px -5px rgba(0, 0, 0, 0.05), 0px 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
    </style>
</head>
<body class="bg-surface font-sans min-h-screen flex flex-col items-center justify-center p-margin-mobile relative overflow-hidden">
<!-- Decorative Background Pattern -->
<div aria-hidden="true" class="absolute inset-0 pointer-events-none pattern-bg w-full h-full"></div>
<!-- Main Content Container -->
<div class="w-full max-w-[420px] relative z-10 flex flex-col items-center">
<!-- Logo Header -->
<div class="mb-unit-lg flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-primary text-[40px]" data-icon="bolt">bolt</span>
<span class="text-[32px] font-bold text-primary tracking-tight">FlashBook</span>
</div>
<!-- Login Card -->
<div class="w-full bg-surface-container-lowest rounded-2xl border border-surface-variant soft-shadow p-[32px]">
<h1 class="text-[24px] leading-[1.3] tracking-[-0.01em] font-bold text-primary mb-[32px]">
                Welcome back
            </h1>
<form action="#" class="space-y-[24px]" method="POST">
<!-- Email Field -->
<div>
<label class="block text-[14px] font-bold text-on-surface mb-unit-sm tracking-[0.02em]" for="email">Email Address</label>
<div class="relative">
<input class="block w-full rounded-xl border border-outline-variant bg-surface-container-lowest py-[12px] px-[16px] text-[16px] text-primary placeholder-on-surface-variant focus:border-primary focus:ring-2 focus:ring-primary focus:ring-offset-0 transition-colors" id="email" name="email" placeholder="you@example.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block text-[14px] font-bold text-on-surface mb-unit-sm tracking-[0.02em]" for="password">Password</label>
<div class="relative">
<input class="block w-full rounded-xl border border-outline-variant bg-surface-container-lowest py-[12px] px-[16px] pr-[40px] text-[16px] text-primary placeholder-on-surface-variant focus:border-primary focus:ring-2 focus:ring-primary focus:ring-offset-0 transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 flex items-center pr-[12px] text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
<div class="mt-2 flex justify-end">
<a class="text-[12px] font-medium text-brand-orange hover:opacity-80 transition-opacity" href="#">Forgot password?</a>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary rounded-full py-[16px] text-[14px] font-bold tracking-[0.02em] hover:bg-inverse-surface transition-colors focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2" type="submit">
                    Log In
                </button>
</form>
<!-- Divider -->
<div class="mt-[32px] mb-[24px] relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-variant"></div>
</div>
<div class="relative flex justify-center">
<span class="bg-surface-container-lowest px-4 text-[12px] font-medium text-on-surface-variant uppercase tracking-wider">or</span>
</div>
</div>
<!-- Sign Up Link -->
<p class="text-center text-[16px] text-on-surface-variant">
                Don't have an account? 
                <a class="font-medium text-brand-orange hover:opacity-80 transition-opacity" href="#">Sign up</a>
</p>
</div>
</div>
</body></html>
